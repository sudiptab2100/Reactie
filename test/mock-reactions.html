<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock Reactions Dialog — Reactie test</title>
    <style>
      body {
        font-family: -apple-system, Helvetica, Arial, sans-serif;
        margin: 0;
        background: #f0f2f5;
      }
      .backdrop {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .dialog {
        width: 360px;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        overflow: hidden;
      }
      .dialog h2 {
        margin: 0;
        padding: 12px 16px;
        border-bottom: 1px solid #dadde1;
        font-size: 16px;
      }
      .list {
        height: 360px;
        overflow-y: auto;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 16px;
        gap: 12px;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #1877f2;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
      }
      .btn {
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn.invite {
        background: #1877f2;
        color: #fff;
      }
      .btn.invited {
        background: #e4e6eb;
        color: #606770;
      }
      .btn.following {
        background: #e4e6eb;
        color: #606770;
      }
      .hint {
        max-width: 360px;
        margin: 0 auto 16px;
        color: #606770;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="backdrop">
      <div>
        <p class="hint">
          Offline mock of Facebook's reactions dialog. Load this file in Chrome,
          then use the floating "Reactie" panel (bottom-right) to test.
          Try <strong>Dry run</strong> first, then a real run. Watch the
          <code>Invite</code> rows flip to <code>Invited</code>.
        </p>

        <!-- Mock post header so page detection has a Page name + logo to read. -->
        <div role="article" class="post" style="width:360px;margin:0 auto 12px;background:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 1px 2px rgba(0,0,0,.1);">
          <div class="post-head" style="display:flex;align-items:center;gap:10px;">
            <img
              class="page-avatar"
              alt=""
              style="width:40px;height:40px;border-radius:50%;background:#1877f2;"
              src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="
            />
            <h3 style="margin:0;font-size:15px;">
              <a role="link" href="/my-test-page-123456789">My Test Page</a>
            </h3>
          </div>
        </div>

        <div class="dialog" role="dialog" aria-label="Reactions">
          <h2>People who reacted</h2>
          <div class="tools" style="padding: 8px 16px; border-bottom: 1px solid #dadde1;">
            <div class="btn invite" id="inviteAll" role="button" tabindex="0" style="display:inline-block;">Invite all</div>
          </div>
          <div class="list" id="list"></div>
        </div>
      </div>
    </div>

    <script>
      // Build a realistic, lazy-loading reactor list.
      // Roughly 1/3 already "Invited", 1/6 "Following", the rest invitable.
      var TOTAL = 60;
      var loaded = 0;
      var listEl = document.getElementById("list");

      function makeRow(i) {
        var row = document.createElement("div");
        row.className = "row";

        var who = document.createElement("div");
        who.className = "who";
        var avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = String.fromCharCode(65 + (i % 26));
        var name = document.createElement("span");
        name.textContent = "Reactor " + (i + 1);
        who.appendChild(avatar);
        who.appendChild(name);

        var btn = document.createElement("div");
        btn.setAttribute("role", "button");
        btn.setAttribute("tabindex", "0");

        var state = i % 6;
        if (state === 0 || state === 3) {
          btn.className = "btn invited";
          btn.textContent = "Invited";
        } else if (state === 5) {
          btn.className = "btn following";
          btn.textContent = "Following";
        } else {
          btn.className = "btn invite";
          btn.textContent = "Invite";
          btn.addEventListener("click", function () {
            // Mimic Facebook: the button flips to "Invited" after clicking.
            btn.className = "btn invited";
            btn.textContent = "Invited";
          });
        }

        row.appendChild(who);
        row.appendChild(btn);
        return row;
      }

      function loadMore(n) {
        for (var k = 0; k < n && loaded < TOTAL; k++) {
          listEl.appendChild(makeRow(loaded));
          loaded++;
        }
      }

      // Initial page, then lazy-load as the list scrolls near the bottom.
      loadMore(12);
      listEl.addEventListener("scroll", function () {
        if (listEl.scrollTop + listEl.clientHeight >= listEl.scrollHeight - 40) {
          loadMore(10);
        }
      });

      // Facebook's native bulk "Invite all": one click loads every row and
      // flips all invitable reactors to "Invited" at once.
      window.__MOCK_NATIVE_ALL_CLICKED = false;
      document
        .getElementById("inviteAll")
        .addEventListener("click", function () {
          window.__MOCK_NATIVE_ALL_CLICKED = true;
          loadMore(TOTAL); // reveal the whole list
          var rows = listEl.querySelectorAll('.btn.invite');
          for (var i = 0; i < rows.length; i++) {
            rows[i].className = "btn invited";
            rows[i].textContent = "Invited";
          }
        });

      // Deterministic ground truth for the e2e test: how many rows are invitable.
      window.__MOCK_EXPECTED_INVITABLE = (function () {
        var c = 0;
        for (var i = 0; i < TOTAL; i++) {
          var s = i % 6;
          if (s !== 0 && s !== 3 && s !== 5) c++;
        }
        return c;
      })();
    </script>

    <!-- Load the real extension logic so this page behaves like the live site. -->
    <link rel="stylesheet" href="../src/panel.css" />
    <script src="../src/config.js"></script>
    <script src="../src/dom.js"></script>
    <script src="../src/page.js"></script>
    <script src="../src/stats.js"></script>
    <script src="../src/keepalive.js"></script>
    <script src="../src/inviter.js"></script>
    <script src="../src/panel.js"></script>
    <script src="../src/content.js"></script>
  </body>
</html>
